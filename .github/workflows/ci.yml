name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            Libraries/PyKotor/requirements.txt
            Libraries/PyKotor/recommended.txt
      - name: Install core test dependencies
        run: python -m pip install -r Libraries/PyKotor/requirements.txt -r Libraries/PyKotor/recommended.txt pytest "typing-extensions>=4.8"
      - name: Compile all library and test source
        run: python -m compileall -q Libraries tests
      - name: Run existing core and patcher tests
        run: python -m pytest tests -ra

  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "build>=1" "setuptools>=68" wheel
      - name: Build all local distributions
        shell: python
        run: |
          import subprocess
          import sys
          for project in ("Utility", "PyKotor", "PyKotorGL", "PyKotorFont"):
              subprocess.run([sys.executable, "-m", "build", "--no-isolation", "--outdir", "dist", "Libraries/" + project], check=True)
      - name: Install the built libraries together
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          wheels = sorted(str(path) for path in Path("dist").glob("*.whl"))
          subprocess.run([sys.executable, "-m", "pip", "install", *wheels], check=True)
      - run: python -m pip check
      - name: Check installed namespace ownership
        working-directory: ${{ runner.temp }}
        run: python -c "import pykotor.resource.formats.gff, pykotor.gl.scene, pykotor.font.draw, utility.system.path"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6,<1"
      - run: ruff check Libraries tests
