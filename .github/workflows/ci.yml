name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r Libraries/PyKotor/requirements.txt \
            -r Libraries/PyKotor/recommended.txt \
            -r Libraries/Utility/requirements.txt \
            pytest pytest-xdist

      - name: Register source directories
        shell: python
        run: |
          import site
          from pathlib import Path

          root = Path.cwd()
          paths = [
              root / "Libraries/PyKotor/src",
              root / "Libraries/Utility/src",
              root / "Libraries/PyKotorGL/src",
              root / "Libraries/PyKotorFont/src",
          ]
          target = Path(site.getsitepackages()[0]) / "pykotor-workspace.pth"
          target.write_text("\n".join(str(path.resolve()) for path in paths) + "\n", encoding="utf-8")

      - name: Compile source
        run: python -m compileall -q Libraries tests

      - name: Run tests
        run: python -m pytest tests -ra

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check Libraries tests
      - run: ruff format --check Libraries tests
