[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyKotorUtility"
version = "1.7"
description = "Shared platform, path, logging and Tk helpers for PyKotor applications."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "NickHugi"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["utility", "utility.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.pyi"]
