[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyKotor"
version = "1.7"
description = "Read, modify and write resources used by the KotOR games."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "NickHugi"}]
dependencies = ["PyKotorUtility==1.7", "ply>=3.11,<4"]

[project.entry-points.pyinstaller40]
hook-dirs = "pykotor.__pyinstaller:get_hook_dirs"

[project.optional-dependencies]
secure_xml = ["defusedxml>=0.7,<1"]
encodings = ["charset-normalizer>=2,<4"]
images = ["Pillow>=9.5"]
font = ["PyKotorFont==1.7"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pykotor", "pykotor.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.pyi"]
