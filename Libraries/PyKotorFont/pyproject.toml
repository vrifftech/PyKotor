[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyKotorFont"
version = "1.7"
description = "Bitmap-font and TXI generation for PyKotor."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "NickHugi"}]
dependencies = ["PyKotor==1.7", "Pillow>=9.5"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pykotor", "pykotor.font", "pykotor.font.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.pyi"]
