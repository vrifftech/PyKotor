# Development tooling only. Each Libraries/* project owns its wheel metadata.
[tool.ruff]
target-version = "py310"
line-length = 175
src = ["Libraries/PyKotor/src", "Libraries/Utility/src", "Libraries/PyKotorGL/src", "Libraries/PyKotorFont/src", "tests"]
extend-exclude = ["build", "dist", "wheelhouse", ".venv", ".venv-*", "**/*.egg-info"]

[tool.ruff.lint]
# Begin with syntax-level errors; legacy style is not rewritten by a cleanup.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Libraries/PyKotor/src", "Libraries/Utility/src", "Libraries/PyKotorGL/src", "Libraries/PyKotorFont/src"]
log_cli = true
log_cli_level = "CRITICAL"
log_cli_format = "%(message)s"
log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
